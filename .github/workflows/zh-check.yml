name: 中文释义排查 (Chinese gloss check)

# Manual only. DeepSeek reads every gloss + example translation of wortschatz.tsv and lists suspicious ones.
on:
  # A push of the script on this content branch runs it (workflow_dispatch only works once the file is on main).
  push:
    branches: ['claude/project-thread-kxwdby']
    paths: ['scripts/proof/*.py', '.github/workflows/zh-check.yml']
  workflow_dispatch:
    inputs:
      model:
        type: choice
        options: [deepseek-v4-pro, deepseek-flash]
        default: deepseek-v4-pro
      limit:
        description: 'Only the first N words (0 = all)'
        default: '0'

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gloss]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZH_MODEL: ${{ inputs.model || 'deepseek-v4-pro' }}
          ZH_LIMIT: ${{ inputs.limit || '0' }}
        run: python3 scripts/proof/zh_gloss_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: zh-gloss
          path: proof/out/zh-gloss.json

  sentences:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sentences]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite-node scripts/proof/extract.ts
      - name: Check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZH_MODEL: ${{ inputs.model || 'deepseek-v4-pro' }}
          ZH_LIMIT: ${{ inputs.limit || '0' }}
        run: python3 scripts/proof/zh_sentence_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: zh-sentences
          path: proof/out/zh-sentences.json

  nouns:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[nouns]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/proof/noun_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: nouns
          path: proof/out/nouns.json
