name: 中文释义排查 (Chinese gloss check)

# Manual only. DeepSeek reads every gloss + example translation of wortschatz.tsv and lists suspicious ones.
on:
  # A push of the script on this content branch runs it (workflow_dispatch only works once the file is on main).
  push:
    branches: ['claude/project-thread-kxwdby']
    paths: ['scripts/proof/*.py', '.github/workflows/zh-check.yml']
  workflow_dispatch:
    inputs:
      model:
        type: choice
        options: [deepseek-v4-pro, deepseek-flash]
        default: deepseek-flash
      limit:
        description: 'Only the first N words (0 = all)'
        default: '0'

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gloss]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZH_MODEL: ${{ inputs.model || 'deepseek-flash' }}
          ZH_LIMIT: ${{ inputs.limit || '0' }}
        run: python3 scripts/proof/zh_gloss_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: zh-gloss
          path: proof/out/zh-gloss.json

  sentences:
    # Lucas 2026-11-27 选 2: check every sentence translation and fill the missing B2 example translations.
    # Saved per batch and pushed back to this branch every 100 batches; stops at once on 402 (no balance) or at the budget;
    # a rerun resumes from proof/out/*.jsonl. Budget: fill 3 CNY + sentences 8 CNY. Lucas 11-27: use deepseek-flash.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sentences]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency: zh-sentences
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite-node scripts/proof/extract.ts
      - name: Fill missing translations
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZH_MODEL: ${{ inputs.model || 'deepseek-flash' }}
        run: python3 scripts/proof/zh_fill.py
      - name: Check sentences
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZH_MODEL: ${{ inputs.model || 'deepseek-flash' }}
          ZH_LIMIT: ${{ inputs.limit || '0' }}
        run: ZH_BUDGET=8 python3 scripts/proof/zh_sentence_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zh-sentences
          path: proof/out/zh-*

  nouns:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[nouns]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/proof/noun_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: nouns
          path: proof/out/nouns.json

  dedef:
    # Lucas 2026-11-28 选 1: German definitions for the words ranked 6001–8000, drafted by deepseek-flash (budget 1.5 CNY),
    # pushed back to this branch, then reviewed by hand.
    if: contains(github.event.head_commit.message, '[dedef')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: de-def
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Draft
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZH_MODEL: deepseek-flash
          DEF_SET: ${{ contains(github.event.head_commit.message, '[dedef-b1]') && 'b1' || 'b2' }}
        run: ZH_BUDGET=1.5 python3 scripts/proof/de_def.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: de-def
          path: proof/out/de-def*
