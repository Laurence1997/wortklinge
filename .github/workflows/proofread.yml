name: 德语校对 (German proofreading)

# Runs whenever German text may have changed. It only reports: findings show up as warnings, in the run summary
# and in the "proof-report" artifact. It never blocks a deploy.
on:
  push:
    paths: ['src/data/**', 'src/core/**', 'src/ui/**', 'src/game/**', 'scripts/proof/**', 'proof/**', '.github/workflows/proofread.yml']
  pull_request:
    paths: ['src/data/**', 'src/core/**', 'src/ui/**', 'src/game/**', 'scripts/proof/**', 'proof/**']
  workflow_dispatch:
    inputs:
      tatoeba:
        description: 'Also compare with Tatoeba native sentences (downloads ~100 MB)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: proofread-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofread:
    runs-on: ubuntu-latest
    services:
      languagetool:
        # Free, open-source LanguageTool server; nothing is sent outside the runner.
        image: erikvl87/languagetool:latest
        ports: ['8010:8010']
        env:
          Java_Xmx: 2g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect German sentences
        run: npx vite-node scripts/proof/extract.ts
      - name: Wait for LanguageTool
        run: |
          for i in $(seq 1 60); do
            curl -fs -d 'language=de-DE&text=Test.' http://localhost:8010/v2/check >/dev/null && exit 0
            sleep 3
          done
          echo "LanguageTool did not start"; exit 1
      - name: LanguageTool
        run: npx vite-node scripts/proof/languagetool.ts
      - name: Restore DeepSeek cache
        uses: actions/cache@v4
        with:
          path: proof/out/deepseek-cache.json
          key: deepseek-${{ github.run_id }}
          restore-keys: deepseek-
      - name: DeepSeek cross-check (skipped until the DEEPSEEK_API_KEY secret exists)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npx vite-node scripts/proof/deepseek.ts
      - name: Tatoeba
        if: (github.event_name == 'workflow_dispatch' && inputs.tatoeba) || contains(github.event.head_commit.message, '[tatoeba]')
        run: |
          scripts/proof/tatoeba-download.sh
          npx vite-node scripts/proof/tatoeba.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-report
          path: |
            proof/out/*.md
            proof/out/*.json
            !proof/out/deepseek-cache.json
