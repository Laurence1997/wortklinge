name: 原创文章 (original B2 articles)

# Original B2 articles (artikel_original_luna.py) into data/wortschatz/artikel-b2-original.tsv, segment by segment
# (SEG below), in parallel with the Wikipedia run in content-b2.yml (separate file, so the two never conflict).
# Runs when this file is pushed: change SEG to start the next segment.
on:
  push:
    paths: ['.github/workflows/artikel-original-trial.yml']
  workflow_dispatch:
    inputs:
      n:
        description: 'How many articles'
        default: '0'

concurrency:
  group: artikel-original-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SEG: '15 16'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install simplemma
      - run: LIMIT=${{ github.event.inputs.n || '0' }} python3 scripts/wortschatz/artikel_original_luna.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898233+github-actions[bot]@users.noreply.github.com'
          git add data/wortschatz/artikel-b2-original.tsv
          git diff --cached --quiet && exit 0
          git commit -m "Original B2 articles, segment $SEG (Luna)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 5; done
