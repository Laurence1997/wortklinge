name: 词表情境标注 (word list situation labels)

# Tags the 6000-word list with 情境/功能线 via the OpenAI model and commits scripts/wortschatz/out/labels.tsv
# back to the same branch. Runs on a push that changes the script (or by hand). Costs a little money per run.
on:
  push:
    paths: ['scripts/wortschatz/label_luna.py', 'scripts/wortschatz/label_luna2.py', 'scripts/wortschatz/label_luna_b2.py', 'scripts/wortschatz/label_verify.py', 'scripts/wortschatz/label_category.py', 'scripts/wortschatz/label_relations.py', '.github/workflows/wortschatz-label.yml']
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only label this many words (0 = all missing)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: wortschatz-label-${{ github.ref }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Label
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          python3 scripts/wortschatz/label_luna.py
          python3 scripts/wortschatz/label_luna_b2.py
          python3 scripts/wortschatz/label_category.py
          python3 scripts/wortschatz/label_relations.py
          if [ ! -f scripts/wortschatz/out/label-verify.tsv ]; then python3 scripts/wortschatz/label_verify.py; fi
      - name: Commit labels
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898233+github-actions[bot]@users.noreply.github.com'
          git add scripts/wortschatz/out/labels*.tsv scripts/wortschatz/out/label-verify.tsv
          git diff --cached --quiet && exit 0
          git commit -m 'Wortschatz: Luna situation/function labels'
          git push
